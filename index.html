<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon Crawl</title>
    <!-- Versioned query string -- browsers cache a favicon far more
         aggressively than normal page assets (often ignoring the usual
         cache-busting a hashed build filename gives every other asset),
         so a real content change here can otherwise sit invisible in a
         returning visitor's tab until they clear it by hand. Bump the
         version any time this file's actual artwork changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
